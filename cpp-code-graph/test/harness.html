<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../media/graph.css">
<title>Code Graph harness</title>
</head>
<body class="vscode-dark">
<div id="app"></div>
<script>
  // Stand-in for the VS Code webview API.
  window.__sent = [];
  window.acquireVsCodeApi = () => ({
    postMessage(m) {
      window.__sent.push(m);
      if (m.type === 'getSource') {
        // Answer like the extension host: lines [start, end] of the file, capped at 200.
        const f = window.__FIXTURES;
        const diff = location.search.includes('diff');
        const text = ((m.side === 'target' && diff ? f.diffSources : f.sources) || {})[m.file];
        setTimeout(() => {
          if (text === undefined) return window.postMessage({ type: 'source', reqId: m.reqId, error: 'Source is not available.' }, '*');
          const all = text.split(/\r?\n/);
          const first = Math.max(1, m.start || 1);
          const wanted = Math.max(first, m.end || first + 29);
          const last = Math.min(all.length, wanted, first + 199);
          window.postMessage({ type: 'source', reqId: m.reqId, startLine: first, lines: all.slice(first - 1, last), truncated: wanted > last }, '*');
        }, 20);
      }
      // ?ai answers questions with a canned investigation, like the agent in the extension host.
      if (m.type === 'ask' && new URLSearchParams(location.search).has('ai')) replayInvestigation(m);
      if (m.type === 'ready') {
        const diff = location.search.includes('diff');
        const f = window.__FIXTURES;
        setTimeout(() => window.postMessage(diff
          ? { type: 'graph', mode: 'diff', graph: f.diff, title: 'sample: abc123 → working tree', compare: { baseLabel: 'abc123', targetLabel: 'working tree' } }
          : { type: 'graph', mode: 'workspace', graph: f.graph, title: 'sample' }, '*'), 10);
      }
    },
    getState() { return null; },
    setState() {}
  });

  function replayInvestigation(m) {
    const g = window.__FIXTURES.graph;
    const by = (key, v) => (g.nodes.find(n => n[key] === v) || {}).id;
    const main = by('name', 'main');
    const render = by('qname', 'geo::Canvas::render');
    const draw = by('qname', 'geo::Shape::draw');
    const plot = by('qname', 'geo::Canvas::plot');
    const logMessage = by('name', 'log_message');
    const steps = [
      { tool: 'search_symbols', args: { query: m.question }, summary: 'Searched the question → 3 symbols', nodeIds: [render, main, plot] },
      { tool: 'neighbors', args: { direction: 'out' }, summary: 'Outgoing calls of geo::Canvas::render (4)', nodeIds: [render, logMessage, draw], note: 'Checking what render calls.' },
      { tool: 'read_code', args: {}, summary: 'Read the code of geo::Canvas::render', nodeIds: [render] }
    ];
    const post = (msg, t) => setTimeout(() => window.postMessage(msg, '*'), t);
    const STEP_MS = 150;
    post({ type: 'aiStart', question: m.question }, 10);
    steps.forEach((s, i) => post({ type: 'aiStep', step: { ...s, i } }, STEP_MS * (i + 1)));
    post({
      type: 'aiResult',
      answer: `Drawing starts in [[${main}]], which calls [[${render}]]. Each shape draws itself through [[${draw}]], which plots pixels with [[${plot}]].`,
      highlight: [main, render, draw, plot],
      path: [main, render, draw, plot],
      hops: [{ s: main, t: render, inferred: false }, { s: render, t: draw, inferred: false, uncertain: true }, { s: draw, t: plot, inferred: false }],
      evidence: [
        { nodeId: render, file: 'src/canvas.cpp', line: 18, claim: 'render calls draw on each shape' },
        { nodeId: main, file: 'src/main.cpp', line: 15, claim: 'main hands the shapes to render' }
      ],
      confidence: 'high',
      steps: steps.length,
      model: 'Harness'
    }, STEP_MS * (steps.length + 2));
  }
</script>
<script>
  // ?large loads a bigger generated project (see test/gen-large.js).
  document.write('<script src="' + (location.search.includes('large') ? 'fixtures-large.js' : 'fixtures.js') + '"><\/script>');
</script>
<script src="../media/highlight.js"></script>
<script src="../media/graph.js"></script>
<script>
  // ?code=name (repeatable) opens the inline code card of every node with that name, for screenshots.
  // ?preset=calls|includes|inheritance|structure and ?arrows=selected|bundled|all pick a view.
  // ?ai replays a canned AI investigation for every question asked.
  const qs = new URLSearchParams(location.search);
  if (qs.get('preset') || qs.get('arrows')) setTimeout(() => {
    if (qs.get('preset')) window.__codeGraph.applyPreset(qs.get('preset'));
    if (qs.get('arrows')) window.__codeGraph.setEdgeMode(qs.get('arrows'));
  }, 100);
  const wantCode = new URLSearchParams(location.search).getAll('code');
  if (wantCode.length) setTimeout(() => {
    const cg = window.__codeGraph;
    for (const name of wantCode) {
      const n = cg.S.graph.nodes.find(x => x.name === name);
      if (n) { cg.reveal(n.id, { center: false }); cg.toggleCode(n.id, true); }
    }
    // ?focus=name centers the view on that node once its code has loaded.
    const focus = new URLSearchParams(location.search).get('focus');
    const target = focus && cg.S.graph.nodes.find(x => x.name === focus);
    if (target) setTimeout(() => cg.centerOn(target.id, false), 150);
  }, 200);
</script>
</body>
</html>
